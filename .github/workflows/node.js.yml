name: Node.js build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci --force
      working-directory: backend
    - run: npm run build
      working-directory: backend
    - run: npm run test
      working-directory: backend
    - run: npm ci --force
      working-directory: frontend
    - run: npm run build
      working-directory: frontend
    - run: npm run test
      working-directory: frontend
